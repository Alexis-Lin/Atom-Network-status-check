<title>ATOM 网络状态 · Demo 界面图</title>
<style>
  :root {
    --bg: #f2f4f0; --surface: #ffffff; --ink: #1a1e19; --ink-2: #5c645b;
    --line: #dde2da; --chip-bg: #e8ece5; --good: #7cc224;
    --dev-bg: #0e1216; --dev-card: #3e4649; --dev-card-2: #2a3134;
    --dev-text: #ffffff; --dev-sub: #9aa1a4;
    --dev-good: #a8e438; --dev-warn: #f2b63c; --dev-bad: #f0563f; --dev-info: #3f8ef7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12150f; --surface: #1b1f17; --ink: #eef1ea; --ink-2: #a2aa9d; --line: #2c3227; --chip-bg: #242a1e; }
  }
  :root[data-theme="dark"] { --bg: #12150f; --surface: #1b1f17; --ink: #eef1ea; --ink-2: #a2aa9d; --line: #2c3227; --chip-bg: #242a1e; }
  :root[data-theme="light"] { --bg: #f2f4f0; --surface: #ffffff; --ink: #1a1e19; --ink-2: #5c645b; --line: #dde2da; --chip-bg: #e8ece5; }

  body {
    background: var(--bg); color: var(--ink);
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.6; margin: 0; padding: 44px 24px 88px;
  }
  main { max-width: 1120px; margin: 0 auto; }
  header.top { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { font-size: 26px; margin: 0; }
  .lede { color: var(--ink-2); font-size: 13.5px; margin: 4px 0 0; }
  .lang-toggle { display: inline-flex; gap: 4px; margin-left: auto; }
  .lang-btn {
    font-size: 12px; font-weight: 600; padding: 3px 14px; border-radius: 99px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer;
  }
  .lang-btn.on { background: var(--good); border-color: var(--good); color: #24350a; }
  h2 { font-size: 17px; margin: 46px 0 22px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(292px, 1fr)); gap: 40px 22px; justify-items: center; }
  figure.shot { margin: 0; display: flex; flex-direction: column; align-items: center; }
  figcaption { margin-top: 15px; text-align: center; max-width: 290px; }
  figcaption b { display: block; font-size: 13.5px; margin-bottom: 2px; }
  figcaption span { font-size: 12px; color: var(--ink-2); }

  /* ─── 圆屏设备（466 → 288 展示）─── */
  .device { width: 288px; height: 288px; position: relative; flex: none; }
  .device .screen {
    width: 466px; height: 466px; border-radius: 50%;
    background: var(--dev-bg); overflow: hidden; position: absolute; top: 0; left: 0;
    transform: scale(0.618); transform-origin: top left;
    box-shadow: 0 0 0 6px #000, 0 12px 30px rgba(0,0,0,.35);
    color: var(--dev-text); font-size: 30px; line-height: 1.4;
    display: flex; flex-direction: column; align-items: center;
  }
  .s-time { color: var(--dev-sub); font-size: 26px; margin-top: 26px; }
  .s-title { font-size: 36px; font-weight: 600; margin-top: 6px; }
  .pill {
    width: 360px; min-height: 84px; border-radius: 44px;
    background: var(--dev-card); display: flex; align-items: center;
    gap: 18px; padding: 0 30px; box-sizing: border-box; margin-top: 20px;
  }
  .pill .grow { flex: 1; }
  .s-label { color: var(--dev-sub); font-size: 26px; margin-top: 18px; }
  .toggle { width: 92px; height: 52px; border-radius: 99px; background: #565d60; position: relative; flex: none; }
  .toggle::after { content: ""; position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border-radius: 50%; background: var(--dev-good); }
  .chev { color: var(--dev-sub); font-size: 30px; flex: none; }
  .ddot { border-radius: 50%; flex: none; }
  .g { background: var(--dev-good); } .y { background: var(--dev-warn); } .r { background: var(--dev-bad); }
  /* 三格 bars：全系统「与服务器连接质量」统一字形（3绿/2黄/1红） */
  .bars { display: inline-flex; align-items: flex-end; gap: 4px; flex: none; }
  .bars i { display: block; width: 8px; border-radius: 3px; }
  .bars .b1 { height: 12px; } .bars .b2 { height: 20px; } .bars .b3 { height: 28px; }
  .bars.lg { gap: 5px; } .bars.lg i { width: 11px; }
  .bars.lg .b1 { height: 16px; } .bars.lg .b2 { height: 27px; } .bars.lg .b3 { height: 38px; }
  .bars .dim { background: #454d50; }
  .mbars { display: inline-flex; align-items: flex-end; gap: 2px; flex: none; }
  .mbars i { display: block; width: 3px; border-radius: 1px; }
  .mbars .b1 { height: 4px; } .mbars .b2 { height: 7px; } .mbars .b3 { height: 10px; }
  .mbars .dim { background: #555d57; }
  .report-card { width: 366px; background: #1b2226; border-radius: 22px; padding: 16px 16px 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; flex: none; }
  .rc-metrics { display: flex; justify-content: space-between; width: 100%; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .rc-metrics > div { text-align: center; }
  .rc-metrics .v { font-size: 27px; font-weight: 600; }
  .rc-metrics .v span { font-size: 16px; }
  .rc-metrics .k { font-size: 17px; color: var(--dev-sub); margin-top: 2px; }
  .rc-foot { font-size: 16px; color: var(--dev-sub); margin-top: 5px; }
  .status-line { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 56px; font-size: 27px; color: #d4d8da; }

  .ring { position: absolute; inset: 10px; border-radius: 50%;
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 14px), #000 calc(100% - 13px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 14px), #000 calc(100% - 13px));
  }
  .ring.scan { background: conic-gradient(from 0deg, transparent 0 30%, var(--dev-info) 95%, #bfe0ff 100%); animation: spin 1.6s linear infinite; }
  .ring.ok   { background: conic-gradient(var(--dev-good) 0 100%); opacity: .8; }
  .ring.warn { background: conic-gradient(var(--dev-warn) 0 100%); opacity: .85; }
  .ring.err  { background: conic-gradient(var(--dev-bad) 0 100%); opacity: .85; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ring.scan { animation: none; } }

  .big-status { font-size: 42px; font-weight: 600; margin-top: 10px; }
  .metrics { display: flex; gap: 34px; margin-top: 16px; font-variant-numeric: tabular-nums; }
  .metrics div { text-align: center; }
  .metrics .v { font-size: 34px; font-weight: 600; }
  .metrics .k { font-size: 22px; color: var(--dev-sub); margin-top: 2px; }
  .advice { font-size: 26px; color: var(--dev-sub); margin-top: 12px; text-align: center; width: 340px; line-height: 1.45; }
  .btn { margin-top: 16px; background: var(--dev-card); border-radius: 99px; font-size: 28px; padding: 12px 42px; }
  .btn.primary { background: var(--dev-good); color: #223305; font-weight: 600; }

  .class-bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 62%, #24313a 0%, #131a1f 55%, #0e1216 100%); }
  .class-hint { position: absolute; top: 54%; width: 100%; text-align: center; color: #4d585f; font-size: 24px; letter-spacing: .2em; }
  .net-badge {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: rgba(20,24,27,.85); border-radius: 99px; padding: 8px 22px;
  }
  .toast {
    position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%);
    background: rgba(30,35,38,.95); border-radius: 99px; white-space: nowrap;
    font-size: 24px; padding: 14px 28px; display: flex; align-items: center; gap: 12px;
  }

  .cc-grid { display: grid; grid-template-columns: 172px 172px; gap: 16px; margin-top: 26px; }
  .cc-tile { height: 96px; border-radius: 52px; background: var(--dev-card-2); display: flex; align-items: center; justify-content: center; position: relative; }
  .cc-tile.on { background: #fff; color: #111; }
  .cc-badge { position: absolute; top: 6px; right: 22px; width: 24px; height: 24px; border-radius: 50%; background: var(--dev-warn); border: 5px solid var(--dev-bg); }
  .cc-batt { color: var(--dev-sub); font-size: 26px; margin-top: 28px; }

  .notif-icon { width: 58px; height: 58px; border-radius: 50%; flex: none; background: #123a42; display: flex; align-items: center; justify-content: center; }
  .notif-body { font-size: 24px; line-height: 1.4; }
  .notif-body b { font-size: 27px; display: block; margin-bottom: 2px; }
  .notif-body span { color: var(--dev-sub); }

  /* ─── 手机 ─── */
  .phone {
    width: 252px; height: 540px; border-radius: 30px; background: #f4f5f2;
    box-shadow: 0 0 0 5px #15181a, 0 12px 30px rgba(0,0,0,.3);
    overflow: hidden; position: relative; display: flex; flex-direction: column;
    color: #191c14; font-size: 12px; line-height: 1.45; flex: none;
  }
  .p-top { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px; }
  .p-top .t { font-weight: 700; font-variant-numeric: tabular-nums; }
  .p-chip { border: 1px solid #dcdfd6; background: #fff; border-radius: 99px; padding: 2px 9px; font-size: 10px; display: flex; gap: 5px; align-items: center; margin-left: auto; }
  .p-chip .ddot { width: 7px; height: 7px; }
  .p-video { position: relative; margin: 0 10px; border-radius: 12px; background: #e6e7e3; height: 252px; overflow: hidden; }
  .p-video .who { position: absolute; bottom: 40px; width: 100%; text-align: center; color: #a2a69b; font-size: 11px; letter-spacing: .2em; }
  .p-pip {
    position: absolute; top: 8px; right: 8px; width: 76px; height: 58px;
    background: #272b28; border-radius: 8px; color: #b7bdb3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 8.5px; text-align: center; gap: 3px; padding: 3px; box-sizing: border-box;
  }
  .p-count {
    position: absolute; right: 8px; top: 130px; width: 58px; height: 58px; border-radius: 50%;
    background: rgba(120,124,118,.85); color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-weight: 700; font-size: 15px; line-height: 1.1;
  }
  .p-count small { font-weight: 400; font-size: 9px; }
  .p-netbadge {
    position: absolute; top: 8px; left: 8px; display: flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,.94); border-radius: 99px; padding: 3px 9px; font-size: 10px; font-weight: 600;
  }
  .p-netbadge .ddot { width: 8px; height: 8px; }
  .p-toast {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    background: rgba(25,28,24,.9); color: #fff; font-size: 9.5px;
    border-radius: 99px; padding: 5px 11px; white-space: nowrap; display: flex; align-items: center; gap: 5px;
  }
  .p-toast .ddot { width: 7px; height: 7px; }
  .p-sheet { flex: 1; margin: 10px; background: #fff; border-radius: 16px; padding: 12px; }
  .p-sheet b { font-size: 13px; }
  .p-ai { display: inline-block; background: #191c14; color: #cff35c; font-size: 9px; font-weight: 700; border-radius: 4px; padding: 1px 5px; margin-right: 5px; vertical-align: 1px; }
  .p-sub { color: #8b9083; font-size: 10px; margin-top: 3px; }
  .p-cta { background: #c9f04e; border-radius: 99px; text-align: center; padding: 9px; font-weight: 700; font-size: 12px; margin-top: 12px; }
</style>

<script>
function setLang(lang) {
  document.querySelectorAll('[data-en]').forEach(function (el) {
    if (!el.dataset.cn) el.dataset.cn = el.textContent;
    el.textContent = lang === 'en' ? el.dataset.en : el.dataset.cn;
  });
  document.querySelectorAll('.lang-btn').forEach(function (b) {
    b.classList.toggle('on', b.dataset.lang === lang);
  });
}
</script>
